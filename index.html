<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>高考志愿顾问</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 720px;
    height: 92vh;
    max-height: 820px;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
  }

  /* ── Header ── */
  .header {
    padding: 14px 20px;
    background: #1a3a6b;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .header-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: #fff;
  }
  .header-info { flex: 1; }
  .header-title { font-size: 15px; font-weight: 600; color: #fff; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 2px; }
  .header-btns { display: flex; gap: 6px; }
  .h-btn {
    background: rgba(255,255,255,0.15);
    border: none; border-radius: 8px;
    color: #fff; font-size: 12px;
    padding: 5px 10px; cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .h-btn:hover { background: rgba(255,255,255,0.25); }

  /* ── Slot bar ── */
  .slot-bar {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 8px 16px;
    border-bottom: 1px solid #edf0f5;
    background: #fafbfc;
    flex-shrink: 0;
  }
  .slot-pill {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid #dde3ee;
    color: #aab0c0;
    background: #fff;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .slot-pill.filled {
    background: #e8eef9;
    color: #1a3a6b;
    border-color: #b3c3e0;
    font-weight: 500;
  }

  /* ── Chat screen ── */
  #chatScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 一键填报表单 ── */
  #quickForm {
    flex-shrink: 0;
    max-height: 58vh;
    overflow-y: auto;
    border-bottom: 1px solid #edf0f5;
    background: #fbfcfe;
    padding: 16px 18px 18px;
  }
  #quickForm::-webkit-scrollbar { width: 5px; }
  #quickForm::-webkit-scrollbar-thumb { background: #d0d8e8; border-radius: 3px; }
  .qf-title { font-size: 15px; font-weight: 700; color: #14264a; }
  .qf-sub { font-size: 12px; color: #6b7689; margin-top: 3px; line-height: 1.6; }
  .qf-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 14px;
  }
  .qf-field { display: flex; flex-direction: column; gap: 5px; }
  .qf-label { font-size: 12px; font-weight: 600; color: #44506a; }
  .qf-label .opt { font-weight: 400; color: #aab0c0; }
  .qf-input, .qf-select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #dde3ee;
    border-radius: 9px;
    font-size: 13.5px; font-family: inherit;
    color: #1a2740; background: #fff; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .qf-select { cursor: pointer; }
  .qf-input:focus, .qf-select:focus {
    border-color: #1a3a6b;
    box-shadow: 0 0 0 3px rgba(26,58,107,0.10);
  }
  .qf-block { margin-top: 14px; }
  .qf-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 7px;
  }
  .chip {
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 18px;
    border: 1px solid #dde3ee;
    background: #fff; color: #5a6478;
    cursor: pointer; user-select: none;
    transition: all 0.15s;
  }
  .chip:hover { border-color: #b3c3e0; }
  .chip.active {
    background: #1a3a6b; color: #fff; border-color: #1a3a6b; font-weight: 500;
  }
  .qf-err {
    font-size: 12px; color: #c0392b; margin-top: 12px;
    display: none; line-height: 1.5;
  }
  .qf-actions {
    display: flex; align-items: center; gap: 12px;
    margin-top: 16px; flex-wrap: wrap;
  }
  .qf-submit {
    padding: 10px 22px;
    border-radius: 10px;
    background: #1a3a6b; color: #fff; border: none;
    font-size: 14px; font-family: inherit; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .qf-submit:hover:not(:disabled) { opacity: 0.88; }
  .qf-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .qf-tip { font-size: 11.5px; color: #aab0c0; line-height: 1.5; }

  .messages {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: #f7f9fc;
  }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: #d0d8e8; border-radius: 3px; }

  .msg { display: flex; gap: 9px; align-items: flex-end; max-width: 84%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; max-width: 92%; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .msg.assistant .msg-avatar { background: #1a3a6b; color: #fff; }
  .msg.user .msg-avatar { background: #e8eef9; color: #1a3a6b; border: 1px solid #d0d8e8; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px; line-height: 1.7;
    word-break: break-word;
  }
  .msg.assistant .msg-bubble {
    background: #fff;
    color: #1a2740;
    border: 1px solid #edf0f5;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .msg.user .msg-bubble {
    background: #1a3a6b;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* 联网来源 */
  .sources {
    margin-top: 10px; padding-top: 9px;
    border-top: 1px dashed #dde3ee;
    font-size: 11.5px; color: #8a93a6;
  }
  .sources-title { font-weight: 600; color: #6b7689; margin-bottom: 4px; }
  .sources a { color: #1a3a6b; text-decoration: none; display: block; margin: 2px 0; }
  .sources a:hover { text-decoration: underline; }

  /* typing indicator */
  .msg-bubble.typing { display: flex; align-items: center; }
  .typing-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: #aab0c0;
    animation: blink 1.2s infinite; margin: 0 1px;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  .typing-label { font-size: 12px; color: #aab0c0; margin-left: 8px; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  /* ── Composer ── */
  .composer {
    border-top: 1px solid #edf0f5;
    background: #fff;
    padding: 10px 16px 12px;
    flex-shrink: 0;
  }
  .tool-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  /* search toggle */
  .ws-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none;
  }
  .ws-toggle input { display: none; }
  .ws-track {
    width: 34px; height: 19px; border-radius: 19px;
    background: #d4dae6; position: relative; transition: background 0.18s;
    flex-shrink: 0;
  }
  .ws-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; transition: transform 0.18s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .ws-toggle input:checked + .ws-track { background: #1a3a6b; }
  .ws-toggle input:checked + .ws-track .ws-thumb { transform: translateX(15px); }
  .ws-label { font-size: 12px; color: #5a6478; }
  .ws-toggle input:checked ~ .ws-label { color: #1a3a6b; font-weight: 500; }
  /* model select */
  .model-select {
    font-size: 12px; font-family: inherit;
    color: #5a6478; background: #f7f9fc;
    border: 1px solid #dde3ee; border-radius: 8px;
    padding: 4px 8px; cursor: pointer; outline: none;
    margin-left: auto;
  }
  .model-select:focus { border-color: #1a3a6b; }

  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-box {
    flex: 1; resize: none;
    border: 1px solid #dde3ee;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px; font-family: inherit;
    color: #1a2740; outline: none;
    max-height: 120px; line-height: 1.5;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-box:focus {
    border-color: #1a3a6b;
    box-shadow: 0 0 0 3px rgba(26,58,107,0.10);
  }
  .input-box::placeholder { color: #b0b8c8; }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: #1a3a6b; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.15s;
  }
  .send-btn:hover:not(:disabled) { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg {
    width: 16px; height: 16px;
    fill: none; stroke: #fff;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .disclaimer {
    font-size: 10.5px; color: #aab0c0;
    margin-top: 8px; text-align: center; line-height: 1.5;
  }

  /* ── Markdown 渲染（助手气泡内）────────────────────── */
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3,
  .msg-bubble h4, .msg-bubble h5, .msg-bubble h6 {
    font-size: 14.5px; font-weight: 700; color: #14264a;
    margin: 12px 0 6px; line-height: 1.4;
  }
  .msg-bubble h1:first-child, .msg-bubble h2:first-child,
  .msg-bubble h3:first-child { margin-top: 0; }
  .msg-bubble p { margin: 6px 0; }
  .msg-bubble p:first-child { margin-top: 0; }
  .msg-bubble p:last-child  { margin-bottom: 0; }
  .msg-bubble strong { font-weight: 700; color: #14264a; }
  .msg-bubble em { font-style: italic; }
  .msg-bubble code {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    font-size: 12.5px; background: #eef2f8; color: #1a3a6b;
    padding: 1px 5px; border-radius: 5px;
  }
  .msg-bubble ul, .msg-bubble ol { margin: 6px 0; padding-left: 20px; }
  .msg-bubble li { margin: 3px 0; line-height: 1.6; }
  .msg-bubble hr { border: none; border-top: 1px solid #e6ebf3; margin: 10px 0; }

  /* 表格：可横向滚动，院校列突出 */
  .md-table-wrap { overflow-x: auto; margin: 9px 0; -webkit-overflow-scrolling: touch; }
  .msg-bubble table {
    border-collapse: collapse; width: 100%;
    font-size: 12.5px; line-height: 1.5; min-width: 380px;
  }
  .msg-bubble th, .msg-bubble td {
    border: 1px solid #e3e9f3; padding: 6px 9px;
    text-align: left; vertical-align: top;
  }
  .msg-bubble td { white-space: normal; }
  .msg-bubble thead th {
    background: #eef4ff; color: #1a3a6b; font-weight: 600; white-space: nowrap;
  }
  .msg-bubble tbody tr:nth-child(even) { background: #fafbfd; }
  .msg-bubble td:first-child { white-space: nowrap; text-align: center; }
  .msg-bubble td:nth-child(2) { font-weight: 700; color: #14264a; white-space: nowrap; }

  @media (max-width: 480px) {
    .qf-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-icon">考</div>
    <div class="header-info">
      <div class="header-title">高考志愿顾问</div>
      <div class="header-sub">DeepSeek 驱动 · 位次/分数以百度高考为参照</div>
    </div>
    <div class="header-btns">
      <button class="h-btn" id="formBtn">填报信息</button>
      <button class="h-btn" id="resetBtn">重置</button>
    </div>
  </div>

  <!-- 聊天页 -->
  <div id="chatScreen">
    <!-- 槽位状态栏 -->
    <div class="slot-bar" id="slotBar"></div>

    <!-- 一键填报表单 -->
    <div id="quickForm">
      <div class="qf-title">一键生成志愿推荐</div>
      <div class="qf-sub">点几下填好下面的信息，不用自己想怎么提问。也可以直接在最下方输入框里随便聊。</div>

      <div class="qf-grid">
        <div class="qf-field">
          <label class="qf-label" for="qfYear">高考年份</label>
          <select class="qf-select" id="qfYear"></select>
        </div>
        <div class="qf-field">
          <label class="qf-label" for="qfProvince">你所在的省份</label>
          <select class="qf-select" id="qfProvince"></select>
        </div>
        <div class="qf-field">
          <label class="qf-label" for="qfRank">位次（全省排名）</label>
          <input class="qf-input" id="qfRank" type="number" inputmode="numeric" min="1" placeholder="例如 12000" />
        </div>
        <div class="qf-field">
          <label class="qf-label" for="qfSubject">选科 <span class="opt">选填</span></label>
          <select class="qf-select" id="qfSubject"></select>
        </div>
      </div>

      <div class="qf-block">
        <div class="qf-label">想去的省份 / 城市 <span class="opt">可多选，留空表示先不限地域</span></div>
        <div class="qf-chips" id="qfRegionChips"></div>
      </div>

      <div class="qf-block">
        <div class="qf-label">想读的专业方向 <span class="opt">可多选，留空表示让我推荐</span></div>
        <div class="qf-chips" id="qfMajorChips"></div>
      </div>

      <div class="qf-err" id="qfErr"></div>

      <div class="qf-actions">
        <button class="qf-submit" id="qfSubmit">生成志愿推荐</button>
        <span class="qf-tip">参照 <b>上一年</b>录取数据 · 以百度高考为准</span>
      </div>
    </div>

    <!-- 消息区 -->
    <div class="messages" id="messages"></div>

    <!-- 输入区 -->
    <div class="composer">
      <div class="tool-row">
        <label class="ws-toggle">
          <input type="checkbox" id="wsToggle" checked />
          <span class="ws-track"><span class="ws-thumb"></span></span>
          <span class="ws-label">联网搜索</span>
        </label>
        <select id="modelSelect" class="model-select" aria-label="选择模型">
          <option value="v3">DeepSeek V3 · 快</option>
          <option value="r1">DeepSeek R1 · 深度思考</option>
        </select>
      </div>
      <div class="input-row">
        <textarea class="input-box" id="inputBox" rows="1"
          placeholder="也可以直接说，例如：浙江考生，位次约1.2万，物化生，想读计算机，偏好上海杭州……"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="发送">
          <svg viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="disclaimer">往年位次/分数以百度高考为参照，分数线、招生计划最终以省考试院 / 阳光高考 / 各校招生网为准</div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  配置区：要改的东西都在这里
// ════════════════════════════════════════════════════════════════
// 通过同域的 Vercel 函数代理来调用 —— 网页和代理同一个域名，浏览器视为同源，
// 跨域(CORS)问题直接消失；学弟学妹只要能打开你这个 Vercel 域名即可（不用翻墙）。
// 这里用相对路径就行，无需写完整域名（部署见 api/ark.js 和说明）。
const ARK_BASE = '/api/ark';

const CONFIG = {
  // Key 放在 Vercel 环境变量 ARK_API_KEY 里（服务端），网页不需要、也看不到。
  API_KEY: '',

  // 普通对话（不联网）
  CHAT_URL: ARK_BASE + '?to=chat',
  // 联网搜索（走 BytePlus 的 bot 接口）
  BOT_URL:  ARK_BASE + '?to=bot',

  // 不联网时用的模型，填你在 BytePlus「Online Inference」建的接入点 ID（ep-xxx）。
  // 这一个接入点对应你建它时选的那个 DeepSeek 模型，所以下面 v3/r1 两项目前
  // 都指向它（点哪个都一样）。想让下拉真正区分，就再建一个接入点分别填。
  MODELS: {
    v3: 'ep-20260619201937-h9sqr',
    r1: 'ep-20260619201937-h9sqr',
  },

  // 联网搜索用的 App/Bot ID（bot-xxxxxxxx）。
  // 在 BytePlus 控制台「AI App Lab → Create App」建一个带联网搜索的应用，拿到 bot-xxx 填这里。
  // 留空：联网开关会自动退化为“不联网”，并在回答里提示。
  BOT_ID: '',
};

// ── 数据：省份 / 专业 / 选科 ───────────────────────────
const PROVINCES = [
  '北京','天津','上海','重庆','河北','山西','辽宁','吉林','黑龙江',
  '江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南',
  '广东','海南','四川','贵州','云南','陕西','甘肃','青海',
  '内蒙古','广西','西藏','宁夏','新疆',
];

const MAJORS = [
  '计算机/软件','人工智能','电子信息','通信工程','自动化','电气工程',
  '机械工程','土木工程','建筑学','临床医学','口腔医学','药学','护理','中医学',
  '法学','金融学','经济学','会计学','工商管理','师范/教育','汉语言文学',
  '英语/外语','新闻传播','心理学','数学','物理学','化学','生物科学','设计学','农学',
];

const SUBJECTS = [
  '物理类（新高考）','历史类（新高考）',
  '物化生','物化地','物化政','物生政','物生地','物地政',
  '史政地','史政生','史地生',
  '理科（旧高考）','文科（旧高考）','还没确定',
];

// ── 槽位定义 ──────────────────────────────────────────
const SLOTS_DEF = [
  { key: 'province',    label: '省份' },
  { key: 'gaokao_year', label: '高考年份' },
  { key: 'score_rank',  label: '分数/位次' },
  { key: 'subject',     label: '选科' },
  { key: 'interest',    label: '专业偏好' },
  { key: 'region',      label: '地域偏好' },
  { key: 'family',      label: '家庭资源' },
  { key: 'goal',        label: '核心诉求' },
];

let slots = {};
SLOTS_DEF.forEach(s => { slots[s.key] = { filled: false, value: '' }; });

let apiKey  = CONFIG.API_KEY;
let history = [];   // [{role, content}, ...]
let loading = false;

// ── DOM 引用 ──────────────────────────────────────────
const chatScreen  = document.getElementById('chatScreen');
const messagesEl   = document.getElementById('messages');
const inputBox     = document.getElementById('inputBox');
const sendBtn      = document.getElementById('sendBtn');
const slotBar      = document.getElementById('slotBar');
const resetBtn     = document.getElementById('resetBtn');
const formBtn      = document.getElementById('formBtn');
const wsToggle     = document.getElementById('wsToggle');
const modelSelect  = document.getElementById('modelSelect');

const quickForm    = document.getElementById('quickForm');
const qfYear       = document.getElementById('qfYear');
const qfProvince   = document.getElementById('qfProvince');
const qfRank       = document.getElementById('qfRank');
const qfSubject    = document.getElementById('qfSubject');
const qfRegionChips= document.getElementById('qfRegionChips');
const qfMajorChips = document.getElementById('qfMajorChips');
const qfErr        = document.getElementById('qfErr');
const qfSubmit     = document.getElementById('qfSubmit');

// ── 填充表单选项 ──────────────────────────────────────
(function initForm() {

function makeChip(text) {
  const c = document.createElement('div');
  c.className = 'chip';
  c.textContent = text;
  c.addEventListener('click', () => c.classList.toggle('active'));
  return c;
}
function selectedChips(container) {
  return Array.from(container.querySelectorAll('.chip.active')).map(c => c.textContent);
}

function renderSlots() {
  slotBar.innerHTML = '';
  SLOTS_DEF.forEach(s => {

    el.className = 'slot-pill' + (slots[s.key].filled ? ' filled' : '');

// ── 从用户消息自动提取槽位（仅作展示，真正理解交给模型）──
function extractSlots(msg) {
  for (const p of PROVINCES) {
    if (msg.includes(p) && !slots.province.filled) { slots.province = { filled: true, value: p }; }
  }

  const yearM = msg.match(/(20[12]\d)\s*年?\s*(?:高考|考生|届|应届|入学)/)
             || msg.match(/(?:我是|考生是?|高考)\s*(20[12]\d)/)
             || msg.match(/(20[12]\d)\s*届/);
  if (yearM && !slots.gaokao_year.filled) {
    slots.gaokao_year = { filled: true, value: yearM[1] + '年' };
  } else if (!slots.gaokao_year.filled && /今年高考|今年的?考生|今年参加高考/.test(msg)) {
    slots.gaokao_year = { filled: true, value: new Date().getFullYear() + '年' };
  }

  const scoreM = msg.match(/(\d{3})\s*分/);
  const rankM  = msg.match(/(\d{3,7})\s*[位名]/);
  const overM  = msg.match(/(?:超|高出|超出|压)(?:一本|特控|控制|本科)?线?\s*(\d{1,3})\s*分?/);
  const diffM  = msg.match(/分差\s*(\d{1,3})/);
  function pushScore(v) {
    if (!slots.score_rank.filled) { slots.score_rank = { filled: true, value: v }; }
    else if (!slots.score_rank.value.includes(v)) { slots.score_rank.value += ' / ' + v; }
  }
  if (scoreM) pushScore(scoreM[1] + '分');
  if (rankM)  pushScore('位次' + rankM[1]);
  if (overM)  pushScore('超线' + overM[1] + '分');
  if (diffM)  pushScore('分差' + diffM[1]);

  const subjs = ['物化生','物化地','物化政','物生政','物生地','物地政',
                 '史政地','史政生','史地生','史政化','物理','历史',
                 '理科','文科','生物','地理','政治','化学'];
  for (const s of subjs) {
    if (msg.includes(s) && !slots.subject.filled) { slots.subject = { filled: true, value: s }; break; }
  }

  const regions = ['长三角','珠三角','京津冀','江浙沪','华东','华南','华中','西南','东北','北方','南方',
                   '北京','上海','广州','深圳','杭州','南京','苏州','宁波','武汉','成都','重庆','西安',
                   '天津','长沙','合肥','济南','青岛','厦门','大连','哈尔滨','省内','本省','离家近'];
  const found = regions.filter(r => msg.includes(r));
  if (found.length) {
    const existing = slots.region.filled ? slots.region.value.split('、') : [];
    const merged = Array.from(new Set(existing.concat(found)));
    slots.region = { filled: true, value: merged.join('、') };
  }

  const fws = ['电力','电网','铁路','医生','医院','教师','老师','做生意',
               '公务员','体制内','烟草','石油','银行','军队','普通家庭','没资源','没背景'];
  for (const fw of fws) {
    if (msg.includes(fw) && !slots.family.filled) { slots.family = { filled: true, value: fw }; break; }
  }

  const goals = ['就业','考公','考编','考研','保研','稳定','高薪','赚钱','深造','出国','留学','创业'];
  for (const g of goals) {
    if (msg.includes(g) && !slots.goal.filled) { slots.goal = { filled: true, value: g }; break; }
  }

  const interests = ['计算机','软件','人工智能','电子','通信','自动化','机械','土木','建筑',
                     '临床','口腔','医学','药学','护理','法学','法律','金融','经济','会计','商科',
                     '师范','汉语言','外语','英语','新闻','传播','心理','设计','理工','文史'];
  for (const i of interests) {
    if (msg.includes(i) && !slots.interest.filled) { slots.interest = { filled: true, value: i }; break; }
  }
}

// ── 系统 prompt ───────────────────────────────────────
const BASE_SYSTEM = `你是一名经验丰富、说话直爽、接地气的高考志愿填报顾问。你像一个懂行的朋友，帮考生和家长把志愿想清楚，而不是甩官话套话。

【数据来源：以百度高考为准，严防信息污染】
- 涉及往年录取位次、分数、招生计划、专业组/试验班设置时，一律以"百度高考"（gaokao.baidu.com）的数据为准。联网搜索时优先核对该来源，搜索词带上"百度高考"和"〔高考年份减1〕年〔省份〕大学专业/录取位次"。
- 严防信息污染：自媒体公众号、贴吧论坛、培训机构软文、问答平台、各类"志愿规划"营销文里的位次/分数/试验班名称经常是错的甚至编的，一律不采信。只要和百度高考对不上，就以百度高考为准；百度高考查不到的，宁可说"查不到、请去官方核对"，也绝不拿来路不明的数字硬填。
- 没把握的院校代码、专业组名称、招生口径，宁缺毋滥，绝不为了显得"具体"而编造班名、代码或位次。

【年份：参照数据锚定"高考当年的前一年"】
- 先确认考生是哪一年高考。参照录取数据默认用"高考年份的前一年"——比如考生是 2025 年高考，就用 2024 年的录取位次做主参照，绝不能用 2023 年或更早的数据当主依据。
- 因为填报时当年录取结果还没出，最近一届完整数据就是前一年。可以再往前补 1—2 年看趋势，但摆出来对比的主参照必须是前一年。
- 报任何位次都写清是哪一年的数据；还不知道考生高考年份时，先问清楚再做位次对比。

【填报常识】
- 位次比分数更可靠：分数线随题目难度浮动，省排名（位次）才是稳定参照。优先用位次，其次看分数、分差（分数减去一本线/特殊类型控制线）。
- 按"冲、稳、保"三档展开，每档给 2—3 个具体选择，落到院校 + 招生专业组/试验班，不要只报校名。
- 很多顶尖高校按"专业大类 / 试验班 / 院校专业组"招生（如"工科试验班""理科试验班"），里面含若干专业、入学后再分流；新高考省份按"院校专业组"投档，每个组有独立录取位次。所以同一所学校不同试验班/专业组，位次能差很远，必须分开谈，不能用"全校大概多少位"糊弄。
- 冲/稳/保按位次对齐：用考生位次和"目标专业组前一年的录取位次"比——比考生略靠前（数字略小）、踮脚够得到的算"冲"；大致相当算"稳"；明显靠后（数字大不少）、很有把握的算"保"。某校/专业组前一年位次比考生好很多（数字小很多）的，是基本够不着，绝不能当"能上的更高平台"列进来，名气再大也不行。差几名到几百名可以算冲，差一两千名就是够不着。
- 别被特殊批次的低分误导：招生表里"最低位次"那行常是国家专项、高校专项、民族班、中外合作或偏远校区，要么需要资格、要么学费很高。默认看"普通批 / 普通类"的录取位次；只有考生明确符合专项/民族资格时才纳入，并把条件和代价（如中外合作学费高）讲清楚。

【最重要的推荐顺序：先看位次能上哪，再回到心仪地域】
地域是"优先考虑"，绝不是"只能在这里挑"。务必按这个顺序讲：

第一步——先不限地域，按位次给定位。用考生位次（参照前一年数据）说清"这个位次大致能上哪些层次的学校、哪些方向的专业组"，给几个真能录取的代表性选择（含冲/稳/保），让考生先有个现实的盘子。别只盯 985 牌子，综合 985、211、双一流，以及"虽非顶尖名校但目标专业很强"的行业特色校——电子信息看两电一邮（电子科大、西电、北邮），电力看华电、上电，财经看两财一贸，法学看五院四系，工科还有南理工、南航、哈工程、西工大、华东理工等，按位次和方向匹配，别硬凑名气。

第二步——再把镜头收回到考生心仪的城市/地域，看这里面有哪些够得着的学校和专业组：哪些是稳/保、哪些只能冲、哪些（够不着的名校）现实里上不了，要直说，别给不切实际的安慰。如果心仪城市里好学校好专业够不着，就老实讲——比如偏好上海杭州、位次大概只够同济的好专业时，就说同济的优势专业是现实目标，复旦、上交、浙大的热门专业大概率够不着；并提示"同样的位次去别的城市能上更好的平台或更强的专业"。

第三步——把取舍摊开，让考生自己拍板：留在心仪城市（可能牺牲学校层次或专业）／冲更高层次的学校（可能要去外地，且大概率只够边缘冷门专业）／保住好专业（学校名气可能没那么响）。尤其点出"名校的边缘专业 vs 实力校的王牌专业"这个最常见的纠结，给出你的分析，但不替他做决定。

【推荐要具体，但先在百度高考核实】
考生要的是能照着填的颗粒度，不是"同济的优势专业是土木、交通"这种泛泛而谈。每给一所学校，尽量写出：该校当年在考生所在省份的招生口径（专业大类 / 试验班 / 院校专业组的名称，如"工科试验班（XX类）"）、这个组大致含哪些专业、入学后怎么分流，以及这个具体招生单位（不是整所学校）的参照位次和数据年份，并归到冲/稳/保哪档、说明理由。
- 报具体班名/专业组/位次前，先在百度高考核实（搜"XX大学 〔高考年份减1〕 〔省份〕 招生专业 录取位次 百度高考"），绝不凭记忆。
- 查到就具体说；查不到或没把握，就如实讲"具体怎么分、对应位次多少，以该校今年在你省的招生计划为准，务必去官方核对"，绝不硬编班名、代码或位次来凑"具体"。

【排版：用 Markdown，让信息一眼能看清】
- 冲/稳/保推荐用一个 Markdown 表格给出，列固定为：梯队 | 院校 | 专业组/试验班 | 参照位次(年份) | 点评。院校名用 **加粗**，让人第一眼就看到是哪所大学。
- "梯队"列只填 冲 / 稳 / 保（可在文字前加一个 🔴/🟡/🟢 圆点，但 emoji 只放在这一列开头，绝不在句子中间乱加）。
- 一所学校有多个专业组就拆成多行，每行一个组。表格放不下的分流规则、取舍建议、提醒，用表格下方的正常段落补充。
- 表格直接输出 Markdown，不要把表格套进代码块（不要用三个反引号包起来）。不要把所有内容堆成一大段，该分段就分段。

【沟通方式】
- 信息不全时自然追问缺的项（省份、高考年份、分数或位次、选科、想学方向、地域偏好、家里有无相关资源、最看重什么），别像填表一样一次甩一串问题。
- 至少知道 省份 + 高考年份 + 分数或位次 + 大致诉求 后，再给完整的冲稳保推荐。
- 说人话、简洁，分析到位但不啰嗦。`;

function buildSystemMessage() {
  const lines = SLOTS_DEF.map(s =>
    `${s.label}：${slots[s.key].filled ? slots[s.key].value : '(未填)'}`
  );
  return BASE_SYSTEM + '\n\n【当前已知用户信息】\n' + lines.join('\n');
}

// ── 调用 DeepSeek（流式；联网走 Bot）──────────────────
async function callDeepSeekStream(userMsg, onDelta) {
  const msgs = [
    { role: 'system', content: buildSystemMessage() },
    ...history.slice(-16),            // 保留最近 8 轮
    { role: 'user', content: userMsg },
  ];

  const useBot = wsToggle.checked && CONFIG.BOT_ID;
  const url    = useBot ? CONFIG.BOT_URL : CONFIG.CHAT_URL;
  const model  = useBot ? CONFIG.BOT_ID : (CONFIG.MODELS[modelSelect.value] || CONFIG.MODELS.v3);

  const body = {
    model: model,
    messages: msgs,
    temperature: 0.6,
    max_tokens: 4096,
    stream: true,
  };

  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey,
    },
    body: JSON.stringify(body),
  });

  if (!resp.ok) {
    const errData = await resp.json().catch(() => ({}));
    throw new Error(errData.error?.message || errData.message || resp.statusText);
  }

  // 解析 SSE 流
  const reader  = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let full   = '';
  const refs = [];           // 联网来源
  const seen = new Set();

  function collectRefs(arr) {
    if (!Array.isArray(arr)) return;
    arr.forEach(r => {
      const u = r && (r.url || r.link || r.web_url);
      if (u && !seen.has(u)) {
        seen.add(u);
        refs.push({ url: u, title: r.title || r.site_name || r.name || u });
      }
    });
  }

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();             // 保留可能不完整的最后一行
    for (const line of lines) {
      const t = line.trim();
      if (!t || !t.startsWith('data:')) continue;
      const data = t.slice(5).trim();
      if (data === '[DONE]') continue;
      try {
        const json  = JSON.parse(data);
        const delta = json.choices?.[0]?.delta?.content || '';
        if (delta) { full += delta; onDelta(full); }
        // 火山 Bot 联网来源（不同版本字段位置可能不同，尽量都兜住）
        collectRefs(json.references);
        collectRefs(json.choices?.[0]?.delta?.references);
        collectRefs(json.choices?.[0]?.message?.references);
      } catch (_) { /* 跳过无法解析的分片 */ }
    }
  }
  return { full, refs };
}

// ── HTML 转义 ─────────────────────────────────────────
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── 行内 Markdown：代码 / 粗体 / 斜体（先转义再替换，防注入）──
function mdInline(s) {
  var t = escapeHtml(s);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  return t;
}

// ── 轻量 Markdown 渲染：表格 / 标题 / 列表 / 分隔线 / 段落 ──
function renderMarkdown(src) {
  var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  var html = '', para = [], i = 0;
  function flushPara() {
    if (para.length) { html += '<p>' + para.map(mdInline).join('<br>') + '</p>'; para = []; }
  }
  function splitRow(r) {
    return r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
  }
  while (i < lines.length) {
    var line = lines[i], trimmed = line.trim();

    if (trimmed === '') { flushPara(); i++; continue; }

    if (/^```/.test(trimmed)) { flushPara(); i++; continue; }

    if (/^([-*_])\1{2,}$/.test(trimmed.replace(/\s+/g, ''))) { flushPara(); html += '<hr>'; i++; continue; }

    var h = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); html += '<h3>' + mdInline(h[2]) + '</h3>'; i++; continue; }

    if (trimmed.indexOf('|') !== -1 && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]*-[-\s:|]*\|?\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') !== -1) {
      flushPara();
      var header = splitRow(trimmed);
      i += 2;
      var bodyRows = [];
      while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() !== '') {
        bodyRows.push(splitRow(lines[i])); i++;
      }
      var tb = '<div class="md-table-wrap"><table><thead><tr>';
      header.forEach(function (c) { tb += '<th>' + mdInline(c) + '</th>'; });
      tb += '</tr></thead><tbody>';
      bodyRows.forEach(function (r) {
        tb += '<tr>';
        for (var k = 0; k < header.length; k++) { tb += '<td>' + mdInline(r[k] || '') + '</td>'; }
        tb += '</tr>';
      });
      tb += '</tbody></table></div>';
      html += tb;
      continue;
    }

    if (/^\s*[-*•]\s+/.test(line)) {
      flushPara();
      var ul = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
        ul.push(lines[i].replace(/^\s*[-*•]\s+/, '')); i++;
      }
      html += '<ul>' + ul.map(function (it) { return '<li>' + mdInline(it) + '</li>'; }).join('') + '</ul>';
      continue;
    }

    if (/^\s*\d+[.、)]\s+/.test(line)) {
      flushPara();
      var ol = [];
      while (i < lines.length && /^\s*\d+[.、)]\s+/.test(lines[i])) {
        ol.push(lines[i].replace(/^\s*\d+[.、)]\s+/, '')); i++;
      }
      html += '<ol>' + ol.map(function (it) { return '<li>' + mdInline(it) + '</li>'; }).join('') + '</ol>';
      continue;
    }

    para.push(trimmed);
    i++;
  }
  flushPara();
  return html;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'assistant' ? '顾' : '我';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMarkdown(text);

  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function appendSources(bubble, refs) {
  if (!bubble || !refs || !refs.length) return;
  const box = document.createElement('div');
  box.className = 'sources';
  let h = '<div class="sources-title">联网来源（' + refs.length + '）</div>';
  refs.slice(0, 8).forEach(function (r, idx) {
    h += '<a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">' +
         (idx + 1) + '. ' + escapeHtml(r.title) + '</a>';
  });
  box.innerHTML = h;
  bubble.appendChild(box);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping(label) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typingIndicator';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '顾';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble typing';
  bubble.innerHTML =
    '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>' +
    (label ? '<span class="typing-label">' + escapeHtml(label) + '</span>' : '');
  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// ── 友好的错误提示 ────────────────────────────────────
function friendlyError(e) {
  const msg = (e && e.message) ? e.message : String(e);
  if (e instanceof TypeError || /Failed to fetch|NetworkError|load failed/i.test(msg)) {
    return '请求没发出去。现在走的是同域的 Vercel 函数代理，正常不该有跨域问题，所以多半是：\n\n' +
           '1）api/ark.js 这个函数还没部署上去（确认仓库里有 /api/ark.js 且 Vercel 已重新部署）；\n' +
           '2）Vercel 里没设环境变量 ARK_API_KEY（在 Project → Settings → Environment Variables 添加后要重新部署）；\n' +
           '3）你打开的是本地文件而不是 Vercel 域名（本地没有 /api 函数，必须用线上域名访问）。\n\n' +
           '都对的话刷新重试。';
  }
  if (/40[13]|invalid.*key|api[_-]?key|unauthor|access denied|authentication/i.test(msg)) {
    return '接口返回鉴权失败：' + msg + '\n\n请确认 API Key 正确、对应模型已开通、账户有可用额度。';
  }
  if (/model.*not.*(found|exist)|invalid.*model|未开通|not.*open|endpoint/i.test(msg)) {
    return '所选模型不可用：' + msg + '\n\n去火山控制台「开通管理」开通该 DeepSeek 模型，' +
           '或把代码 CONFIG.MODELS 里的模型名改成你接入点的 ep-xxxxxxxx / 最新模型名。';
  }
  return '请求出错：' + msg + '\n稍后重试，或换个模型再试。';
}

// ── 发送消息 ──────────────────────────────────────────
async function sendMessage(presetText) {
  const text = (typeof presetText === 'string' ? presetText : inputBox.value).trim();
  if (!text || loading) return;

  if (typeof presetText !== 'string') {
    inputBox.value = '';
    inputBox.style.height = 'auto';
  }
  loading = true;
  sendBtn.disabled = true;
  qfSubmit.disabled = true;

  addMessage('user', text);
  extractSlots(text);
  renderSlots();

  const wantSearch = wsToggle.checked;
  addTyping(wantSearch ? '正在查阅最新资料…' : '正在思考…');

  let bubble = null;
  try {
    const { full, refs } = await callDeepSeekStream(text, (partial) => {
      if (!bubble) { removeTyping(); bubble = addMessage('assistant', ''); }
      bubble.innerHTML = renderMarkdown(partial);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    if (!bubble) {
      removeTyping();
      bubble = addMessage('assistant', full || '（这次没有返回内容，请重试。）');
    } else {
      bubble.innerHTML = renderMarkdown(full);
    }
    appendSources(bubble, refs);

    // 联网开了、但没配 Bot 时给一句温柔提示（只提示一次）
    if (wantSearch && !CONFIG.BOT_ID && !window.__warnedNoBot) {
      window.__warnedNoBot = true;
      addMessage('assistant',
        '小提示：你打开了「联网搜索」，但还没在代码 CONFIG.BOT_ID 里配置火山的联网 Bot，' +
        '所以这次其实没有真正联网，位次数据可能不是最新的。配置方法见随附说明。');
    }

    history.push({ role: 'user',      content: text });
    history.push({ role: 'assistant', content: full });
  } catch (e) {
    removeTyping();
    if (bubble) bubble.parentElement.remove();
    addMessage('assistant', friendlyError(e));
  }

  loading = false;
  sendBtn.disabled = false;
  qfSubmit.disabled = false;
  inputBox.focus();
}

// ── 一键填报：组装提示词并发送 ─────────────────────────
function submitQuickForm() {
  if (loading) return;
  const year     = qfYear.value;
  const province = qfProvince.value;
  const rank     = qfRank.value.trim();
  const subject  = qfSubject.value;
  const regions  = selectedChips(qfRegionChips);
  const majors   = selectedChips(qfMajorChips);

  if (!province) { showFormErr('请先选择你所在的省份'); return; }
  if (!rank || Number(rank) < 1) { showFormErr('请填写你的全省位次（一个正整数）'); return; }
  qfErr.style.display = 'none';

  // 写入槽位（顶部状态栏会同步显示）
  slots.province    = { filled: true, value: province };
  slots.gaokao_year = { filled: true, value: year + '年' };
  slots.score_rank  = { filled: true, value: '位次' + rank };
  if (subject)        slots.subject  = { filled: true, value: subject };
  if (regions.length) slots.region   = { filled: true, value: regions.join('、') };
  if (majors.length)  slots.interest = { filled: true, value: majors.join('、') };
  renderSlots();

  const prevYear = Number(year) - 1;
  const subjLine = subject ? `选科${subject}，` : '';
  const regionLine = regions.length
    ? `想去的省份/城市：${regions.join('、')}。`
    : '地域暂时不限，先帮我按位次看全国能上哪些。';
  const majorLine = majors.length
    ? `想读的专业方向：${majors.join('、')}。`
    : '专业方向还没完全想好，请结合我的位次给些建议。';

  const prompt =
`我是${year}年${province}高考考生，${subjLine}全省位次大约${rank}名。
${regionLine}
${majorLine}

请按这个顺序给我志愿建议：先不限地域、用我的位次说清楚大概能上哪些层次的学校和专业组（参照${prevYear}年的录取数据），再把镜头收回到我想去的地方看哪些是冲/稳/保、哪些够不着；最后把取舍摊开让我自己拍板。
数据请优先参考百度高考（gaokao.baidu.com）里"${prevYear}年${province}大学专业 录取位次"的口径，必要时联网核对，不要采信自媒体或论坛的位次。冲稳保用 Markdown 表格给出。`;

  hideForm();
  sendMessage(prompt);
}

function showFormErr(msg) { qfErr.textContent = msg; qfErr.style.display = 'block'; }
function showForm() { quickForm.style.display = 'block'; }
function hideForm() { quickForm.style.display = 'none'; }

// ── 重置 ──────────────────────────────────────────────
function resetChat() {
  history = [];
  window.__warnedNoBot = false;
  SLOTS_DEF.forEach(s => { slots[s.key] = { filled: false, value: '' }; });
  messagesEl.innerHTML = '';
  renderSlots();
  showForm();
  welcome();
}

function welcome() {
  addMessage('assistant',
    '你好，我是你的高考志愿填报顾问。\n\n' +
    '上面的表单点几下填好就行——年份、省份、位次、想去哪、想学啥，我来帮你想怎么填。当然你也可以直接在下面打字跟我聊。\n\n' +
    '我会先不限地域、按你的位次告诉你"这个位次大概能上哪些学校和专业组"，再回到你心仪的城市看哪些够得着、哪些够不着，最后把取舍摊开让你自己拍板——地域只当偏好，不是硬门槛。\n\n' +
    '往年位次和分数我以百度高考的数据为准、尽量联网核对；正式填报前请再去省考试院 / 阳光高考 / 各校招生网确认。'
  );
}

// ── 事件绑定 ──────────────────────────────────────────
sendBtn.addEventListener('click', () => sendMessage());
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputBox.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
resetBtn.addEventListener('click', resetChat);
formBtn.addEventListener('click', showForm);
qfSubmit.addEventListener('click', submitQuickForm);

// ── 启动 ──────────────────────────────────────────────
renderSlots();
welcome();
inputBox.focus();
</script>
